<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TextEdit - GLITCH HUB</title>
    <style>
        :root {
            --bg-color: #ff5733; 
            --win-grey: #c0c0c0;
            --win-blue: linear-gradient(90deg, #000080, #1084d0);
            --font-main: "Futura", "Trebuchet MS", sans-serif;
            --stripe-height: 25px;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            font-family: var(--font-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Thick Black Stripes */
        body::before, body::after {
            content: "";
            position: fixed;
            left: 0;
            width: 100%;
            height: var(--stripe-height);
            background-color: black;
            z-index: 100;
        }
        body::before { top: 0; }
        body::after { bottom: 0; }

        /* Layout Wrapper */
        .workspace {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 40px;
            margin-top: 20px;
        }

        /* Column for side images */
        .side-column {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Retro Window Base Style */
        .window {
            background: var(--win-grey);
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #404040;
            border-bottom: 2px solid #404040;
            box-shadow: 4px 4px 0px black;
            padding: 3px;
        }

        .window-header {
            background: var(--win-blue);
            color: white;
            padding: 3px 8px;
            font-size: 0.8rem;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Main Text Box Width */
        .main-text-window {
            width: 500px;
        }

        /* Smaller Image Boxes */
        .image-window {
            width: 120px;
        }

        .window-content {
            margin-top: 3px;
            background: #ffffff;
            border: 2px inset #808080;
            overflow: hidden;
        }

        .text-area {
            height: 350px;
            padding: 15px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .image-area {
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-area img {
            max-width: 100%;
            max-height: 100%;
            object-fit: cover;
        }

        .back-btn {
            background: var(--win-grey);
            color: black;
            border: 1px solid white;
            border-right-color: #404040;
            border-bottom-color: #404040;
            text-decoration: none;
            font-size: 10px;
            padding: 0 4px;
        }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 15px;
            background-color: black;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div class="workspace">
        
        <div class="side-column">
            <div class="window image-window">
                <div class="window-header"><span>img_1</span></div>
                <div class="window-content image-area"><img src="https://via.placeholder.com/120x100" alt="1"></div>
            </div>
            <div class="window image-window">
                <div class="window-header"><span>img_2</span></div>
                <div class="window-content image-area"><img src="https://via.placeholder.com/120x100" alt="2"></div>
            </div>
            <div class="window image-window">
                <div class="window-header"><span>img_3</span></div>
                <div class="window-content image-area"><img src="https://via.placeholder.com/120x100" alt="3"></div>
            </div>
        </div>

        <div class="window main-text-window">
            <div class="window-header">
                <span>NOTES.txt</span>
                <a href="index.html" class="back-btn">X</a>
            </div>
            <div class="window-content text-area">
                <p>Edit this text to include your paragraph here...</p>
                <p>The side windows are ready for your custom images. Simply replace the placeholder URLs in the "img" tags.</p>
                <span class="cursor"></span>
            </div>
        </div>

        <div class="side-column">
            <div class="window image-window">
                <div class="window-header"><span>img_4</span></div>
                <div class="window-content image-area"><img src="https://via.placeholder.com/120x100" alt="4"></div>
            </div>
            <div class="window image-window">
                <div class="window-header"><span>img_5</span></div>
                <div class="window-content image-area"><img src="https://via.placeholder.com/120x100" alt="5"></div>
            </div>
            <div class="window image-window">
                <div class="window-header"><span>img_6</span></div>
                <div class="window-content image-area"><img src="https://via.placeholder.com/120x100" alt="6"></div>
            </div>
        </div>

    </div>

</body>
</html>
