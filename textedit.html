<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TextEdit - GLITCH HUB</title>
    <style>
        :root {
            /* 1. REPLACE THE URL BELOW WITH YOUR BACKGROUND IMAGE FILE */
            --bg-image: url('glit ch.jpg'); 
            --bg-fallback-color: #ff5733; 
            
            --win-grey: #c0c0c0;
            --win-blue: linear-gradient(90deg, #000080, #1084d0);
            --font-main: "Futura", "Trebuchet MS", sans-serif;
            --stripe-height: 30px;
        }

        body {
            margin: 0;
            padding: 0;
            /* Applies background image, centered and covering the whole screen */
            background: var(--bg-image) no-repeat center center fixed;
            background-size: cover;
            background-color: var(--bg-fallback-color);
            
            font-family: var(--font-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Thick Black Stripes */
        body::before, body::after {
            content: "";
            position: fixed;
            left: 0;
            width: 100%;
            height: var(--stripe-height);
            background-color: black;
            z-index: 100;
        }
        body::before { top: 0; }
        body::after { bottom: 0; }

        /* Persistent Desktop Navigation Interface */
        .desktop-nav {
            position: fixed;
            top: calc(var(--stripe-height) + 15px);
            left: 20px;
            z-index: 200;
        }

        .workspace {
            display: flex;
            align-items: flex-start; /* Aligns columns to top */
            gap: 30px;
            padding: 80px 20px 60px 20px; /* Top padding open for desktop home icon */
            z-index: 10;
        }

        .side-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Retro Window Styling */
        .window {
            background: var(--win-grey);
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #404040;
            border-bottom: 2px solid #404040;
            box-shadow: 6px 6px 0px rgba(0,0,0,0.5);
            padding: 3px;
        }

        .window-header {
            background: var(--win-blue);
            color: white;
            padding: 4px 10px;
            font-size: 0.9rem;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Larger Text Box */
        .main-text-window {
            width: 550px;
        }

        /* Larger Image Boxes */
        .image-window {
            width: 180px; 
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .image-window:hover {
            transform: scale(1.03); /* Tactile feedback on grid select */
        }

        .window-content {
            margin-top: 3px;
            background: #ffffff;
            border: 2px inset #808080;
            overflow: hidden;
        }

        .text-area {
            height: 480px; /* Taller to match the new image column height */
            padding: 20px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            line-height: 1.5;
            color: black;
        }

        .image-area {
            height: 140px; 
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #000; /* Black background for any image gaps */
        }

        .image-area img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Ensures the whole glitch is visible without cropping */
        }

        /* Retro Platform Buttons */
        .back-btn, .close-modal-btn, .home-btn {
            background: var(--win-grey);
            color: black;
            border: 1px solid white;
            border-right-color: #404040;
            border-bottom-color: #404040;
            text-decoration: none;
            font-size: 12px;
            padding: 1px 6px;
            font-family: Arial, sans-serif;
