<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLITCH HUB</title>
    <style>
        :root {
            --bg-color: #008080; /* Classic 2000s Teal Desktop */
            --win-grey: #c0c0c0;
            --win-blue: linear-gradient(90deg, #000080, #1084d0);
            --font-main: "Futura", "Trebuchet MS", sans-serif;
            --stripe-height: 20px; /* Adjust this to make the black lines even bigger */
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            font-family: var(--font-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Thick Black Stripes */
        body::before, body::after {
            content: "";
            position: fixed;
            left: 0;
            width: 100%;
            height: var(--stripe-height);
            background-color: black;
            z-index: 100;
        }
        body::before { top: 0; }
        body::after { bottom: 0; }

        h1 {
            font-size: 5rem;
            color: white;
            text-shadow: 4px 4px 0px black;
            margin-top: 80px;
            letter-spacing: -2px;
            text-transform: uppercase;
        }

        .container {
            display: flex;
            gap: 50px;
            padding: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .box-link {
            text-decoration: none;
            color: black;
            display: block;
        }

        /* 2000s Pop-up Styling (Beveled Edges) */
        .window {
            background: var(--win-grey);
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #404040;
            border-bottom: 2px solid #404040;
            box-shadow: 2px 2px 0px black;
            width: 320px;
            padding: 3px;
        }

        .window-header {
            background: var(--win-blue);
            color: white;
            padding: 3px 8px;
            font-size: 0.85rem;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: sans-serif; /* Standard system font look */
        }

        /* Retro "X" Button */
        .close-btn {
            background: var(--win-grey);
            color: black;
            border-top: 1px solid #ffffff;
            border-left: 1px solid #ffffff;
            border-right: 1px solid #404040;
            border-bottom: 1px solid #404040;
            width: 16px;
            height: 14px;
            line-height: 12px;
            text-align: center;
            font-size: 10px;
            font-weight: bold;
        }

        .window-content {
            margin-top: 3px;
            background: #ffffff;
            border: 2px inset #808080; /* Sunken look */
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .window-content img {
            max-width: 100%;
            max-height: 100%;
            object-fit: cover;
        }

        /* Interactive feel */
        .box-link:active .window {
            border-top: 2px solid #404040;
            border-left: 2px solid #404040;
            border-right: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;
            transform: translate(1px, 1px);
        }
    </style>
</head>
<body>

    <h1>GLITCH HUB</h1>

    <div class="container">
        <a href="textedit.html" class="box-link">
            <div class="window">
                <div class="window-header">
                    <span>TextEdit.exe</span>
                    <div class="close-btn">x</div>
                </div>
                <div class="window-content">
                    <img src="https://via.placeholder.com/300x220" alt="TextEdit Image">
                </div>
            </div>
        </a>

        <a href="audacity.html" class="box-link">
            <div class="window">
                <div class="window-header">
                    <span>Audacity.exe</span>
                    <div class="close-btn">x</div>
                </div>
                <div class="window-content">
                    <img src="PharrellWill34.png" alt="Audacity Image">
                </div>
            </div>
        </a>
    </div>

</body>
</html>
